<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live SOS Tracking | AstraSOS</title>
    
    <!-- Favicon fix -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚨</text></svg>">
    
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- Leaflet JS (Free Alternative to Google Maps) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        :root {
            --primary: #FF3B30;
            --secondary: #1A73E8;
            --bg: #0F172A;
            --card: #1E293B;
            --text: #F8FAFC;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            overflow: hidden;
        }

        #map {
            height: 100%;
            width: 100%;
            filter: grayscale(0.2) contrast(1.1);
        }

        .overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            z-index: 1000;
            pointer-events: none;
        }

        .status-card {
            background: rgba(30, 41, 59, 0.9);
            backdrop-filter: blur(12px);
            padding: 16px 24px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            gap: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            max-width: fit-content;
            pointer-events: auto;
        }

        .pulse {
            width: 12px;
            height: 12px;
            background: var(--primary);
            border-radius: 50%;
            box-shadow: 0 0 0 rgba(255, 59, 48, 0.4);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 59, 48, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(255, 59, 48, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 59, 48, 0); }
        }

        .info h1 {
            margin: 0;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.7;
        }

        .info p {
            margin: 4px 0 0;
            font-size: 18px;
            font-weight: 700;
        }

        .coords-box {
            position: absolute;
            bottom: 30px;
            right: 20px;
            background: rgba(0,0,0,0.8);
            padding: 10px 15px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 12px;
            color: #10B981;
            border: 1px solid #10B981;
        }

        /* Dark mode map styles */
        .gm-style {
            background-color: #0F172A !important;
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <div class="overlay">
        <div class="status-card" id="statusCard">
            <div class="pulse"></div>
            <div class="info">
                <h1>Emergency Tracking</h1>
                <p id="statusText">Awaiting Signal...</p>
            </div>
        </div>
    </div>

    <div class="coords-box" id="coords">
        LAT: --.----- | LNG: --.-----
    </div>

    <script>
        const SUPABASE_URL = "https://yufngipguuuxdvyucpef.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl1Zm5naXBndXV1eGR2eXVjcGVmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzczOTQ2NTYsImV4cCI6MjA5Mjk3MDY1Nn0.M555FF8jZoxS850ToFFquyylqzADQ-WnSE9hkaLzZyo";
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const params = new URLSearchParams(window.location.search);
        const incidentId = params.get("incident");

        let map, marker, path;
        const history = [];

        function initMap() {
            // Initialize map with a dark theme (CartoDB Dark Matter)
            map = L.map('map', {
                zoomControl: true,
                attributionControl: false
            }).setView([0, 0], 17);

            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                maxZoom: 19
            }).addTo(map);

            // Create a custom red circle marker for the user
            marker = L.circleMarker([0, 0], {
                radius: 10,
                fillColor: "#FF3B30",
                color: "#FFFFFF",
                weight: 2,
                opacity: 1,
                fillOpacity: 1
            }).addTo(map);

            path = L.polyline([], {
                color: '#FF3B30',
                weight: 4,
                opacity: 0.6
            }).addTo(map);
        }

        function updateUI(lat, lng) {
            const pos = [lat, lng];
            
            marker.setLatLng(pos);
            map.panTo(pos);
            
            history.push(pos);
            path.setLatLngs(history);

            document.getElementById("statusText").innerText = "LIVE • User Moving";
            document.getElementById("coords").innerText = `LAT: ${lat.toFixed(6)} | LNG: ${lng.toFixed(6)}`;
        }

        // Initialize
        initMap();

        if (incidentId) {
            console.log("Subscribing to incident:", incidentId);
            
            // 1. Fetch initial location from DB
            supabaseClient.from('live_locations')
                .select('*')
                .eq('incident_id', incidentId)
                .single()
                .then(({ data }) => {
                    if (data) updateUI(data.latitude, data.longitude);
                });

            // 2. Listen for Realtime Broadcasts
            const channel = supabaseClient.channel(`location:${incidentId}`)
                .on('broadcast', { event: 'location_update' }, (payload) => {
                    console.log("Broadcast received:", payload);
                    const { latitude, longitude } = payload.payload;
                    updateUI(latitude, longitude);
                })
                .subscribe((status) => {
                    if (status === 'SUBSCRIBED') {
                        console.log("Subscribed to realtime channel");
                    }
                });
        } else {
            document.getElementById("statusText").innerText = "Error: No Incident ID";
        }
    </script>
</body>
</html>
